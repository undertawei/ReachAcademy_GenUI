<html xmlns:m="http://schemas.openxmlformats.org/officeDocument/2006/math">
  <body>
    <p>
      empty degree:
      <m:oMath
        ><m:rad
          ><m:deg /><m:e
            ><m:r><m:t>x</m:t></m:r></m:e
          ></m:rad
        ></m:oMath
      >
      explicit degree:
      <m:oMath
        ><m:rad
          ><m:deg
            ><m:r><m:t>3</m:t></m:r></m:deg
          ><m:e
            ><m:r><m:t>y</m:t></m:r></m:e
          ></m:rad
        ></m:oMath
      >
      hidden degree:
      <m:oMath
        ><m:rad
          ><m:radPr><m:degHide m:val="1" /></m:radPr
          ><m:deg
            ><m:r><m:t>4</m:t></m:r></m:deg
          ><m:e
            ><m:r><m:t>z</m:t></m:r></m:e
          ></m:rad
        ></m:oMath
      >
      upright unit:
      <m:oMath
        ><m:r
          ><m:rPr><m:nor /></m:rPr><m:t>m</m:t></m:r
        ></m:oMath
      >
      upright text:
      <m:oMath
        ><m:r
          ><m:rPr><m:nor /></m:rPr><m:t>单位</m:t></m:r
        ></m:oMath
      >
    </p>
  </body>
</html>
