<html xmlns:m="http://schemas.openxmlformats.org/officeDocument/2006/math">
  <body>
    <p>
      fraction:
      <m:oMath
        ><m:f
          ><m:num
            ><m:r><m:t>a</m:t></m:r></m:num
          ><m:den
            ><m:r><m:t>b</m:t></m:r></m:den
          ></m:f
        ></m:oMath
      >
      delimiter:
      <m:oMath
        ><m:d
          ><m:dPr><m:begChr m:val="[" /><m:endChr m:val="]" /></m:dPr
          ><m:e
            ><m:r><m:t>x</m:t></m:r></m:e
          ></m:d
        ></m:oMath
      >
      bar:
      <m:oMath
        ><m:bar
          ><m:barPr><m:pos m:val="top" /></m:barPr
          ><m:e
            ><m:r><m:t>y</m:t></m:r></m:e
          ></m:bar
        ></m:oMath
      >
    </p>
  </body>
</html>
